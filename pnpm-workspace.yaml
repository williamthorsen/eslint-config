packages:
  - packages/*

allowBuilds:
  esbuild: true
  lefthook: true
  # Ships a prebuilt binding per platform as an optional dependency; the postinstall builds from
  # source only where no binding exists, so it never needs to run here.
  unrs-resolver: false

catalog:
  '@williamthorsen/toolbelt.vitest': '0.8.0'
  eslint: '10.9.1'
  eslint-plugin-n: '18.3.0'
  readyup: '0.35.0'
  typescript: '6.0.3'
  typescript-eslint: '8.68.0'

peerDependencyRules:
  allowedVersions:
    'eslint-plugin-jest-dom>eslint': '>=10'
    'eslint-plugin-jsx-a11y>eslint': '>=10'
    'eslint-plugin-react>eslint': '>=10'

# Keep pnpm 11's 24h minimumReleaseAge soak (supply-chain protection), set
# explicitly to pin the policy, but exclude first-party packages so a freshly
# published version can be consumed downstream without waiting out the soak.
minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  - '@williamthorsen/*'
  - codeassembly
  - codeassembly-lifecycle
  - readyup
  - v11y-check

savePrefix: ''
