packages:
  - packages/*

allowBuilds:
  esbuild: true
  lefthook: true
  # Ships a prebuilt binding per platform as an optional dependency; the postinstall builds from
  # source only where no binding exists, so it never needs to run here.
  unrs-resolver: false

catalog:
  '@williamthorsen/toolbelt.vitest': '0.10.1'
  eslint: '10.10.0'
  eslint-plugin-n: '18.3.0'
  readyup: '0.38.0'
  typescript: '6.0.3'
  typescript-eslint: '8.70.0'
  vitest: '4.1.11'

peerDependencyRules:
  allowedVersions:
    'eslint-plugin-jest-dom>eslint': '>=10'
    'eslint-plugin-jsx-a11y>eslint': '>=10'
    'eslint-plugin-react>eslint': '>=10'

# Pin pnpm 11's default 24-hour release-age soak against supply-chain attacks, and exempt first-party
# packages so that a fresh release is usable downstream at once.
minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  - '@williamthorsen/*'
  - codeassembly
  - codeassembly-lifecycle
  - readyup
  - v11y-check

savePrefix: ''
