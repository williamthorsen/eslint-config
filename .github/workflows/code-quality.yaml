# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Code quality checks

on:
  push:
    branches:
      - main
      - next

  pull_request:
    branches:
      - main
      - next

  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  code-quality:
    uses: williamthorsen/.github/.github/workflows/code-quality-pnpm-workflow.yaml@v8
    with:
      # The legs together run `nmr ci`: `build`, then the `check:strict` override in `.config/nmr.config.ts`.
      # `build` has a leg of its own because no other leg reads its output.
      check-commands: >-
        [
          { "name": "build", "command": "pnpm exec nmr build" },
          { "name": "lint", "command": "pnpm exec nmr lint:strict" },
          { "name": "static", "command": "pnpm exec nmr typecheck && pnpm exec nmr fmt:check && pnpm exec nmr verify:kits" },
          { "name": "test", "command": "pnpm exec nmr test:coverage" }
        ]
