rejections:
  - rule: reduced-object-relative
    rule-version: '1'
    file: packages/typescript/.readyup/kits/default.ts
    phrase: peer dependency's installed
    ground: 'not the construction: `installed` modifies `version`, and the relative has its `that`'
  - rule: reduced-object-relative
    rule-version: '1'
    file: packages/typescript/.readyup/kits/default.ts
    phrase: relative one anchors
    ground: "not the construction: `anchors` is the clause's main verb"
  - rule: reduced-object-relative
    rule-version: '1'
    file: packages/typescript/.readyup/kits/default.ts
    phrase: repo's tsconfigs permit
    ground: "not the construction: `permit` is the sentence's main verb"
  - rule: reduced-object-relative
    rule-version: '1'
    file: packages/typescript/.readyup/kits/default.ts
    phrase: track the package's own peer ranges
    ground: "not the construction: `track` is the clause's main verb"
  - rule: reduced-object-relative
