rules:
  capitalization-after-colon:
    version: '1'
    swept-at: 2026-09-25
    detected: false
    roots:
      - packages/typescript/src/plugins
  doc-descriptions:
    version: '1'
    swept-at: 2026-09-25
    detected: false
    roots:
      - packages/typescript/src/plugins
  em-dash:
    version: '1'
    swept-at: 2026-09-25
    detected: true
    roots:
